<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Provedex</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/web/jetbrains-mono.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-left">
        <span class="brand">provedex</span>
        <span class="hdr-sub">cryptographic evidence layer for regulated AI agents</span>
      </div>
      <div class="hdr-right mono">
        <span id="session-id">session ----</span>
        <span id="pubkey">pubkey ----</span>
      </div>
    </header>

    <main class="main">
      <section class="pane pane-left">
        <div class="pane-hdr">
          <span class="pane-title">conversation</span>
          <span id="mic-status" class="pane-meta mono">idle</span>
        </div>
        <div id="conversation" class="conv"></div>
        <div class="pane-foot">
          <button id="mic-btn" class="btn btn-primary">hold to talk</button>
          <span class="hint">press and hold, release to send</span>
        </div>
      </section>

      <section class="pane pane-right">
        <div class="pane-hdr">
          <span class="pane-title">signed event stream</span>
          <span id="event-count" class="pane-meta mono">0 events</span>
        </div>
        <div class="evt-cols mono">
          <span class="col-seq">seq</span>
          <span class="col-type">type</span>
          <span class="col-hash">self_hash</span>
          <span class="col-ts">timestamp</span>
        </div>
        <div id="events" class="evt-list mono"></div>
      </section>
    </main>

    <footer class="foot">
      <div class="foot-left">
        <button id="verify-btn" class="btn">verify chain</button>
        <button id="tamper-btn" class="btn">tamper test</button>
        <button id="export-btn" class="btn">export bundle</button>
      </div>
      <div id="verify-result" class="foot-right mono">awaiting verify</div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
