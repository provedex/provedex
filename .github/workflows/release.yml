name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: install cross-build deps (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: cargo build provedex-agent
        run: cargo build --release --locked --target ${{ matrix.target }} -p provedex-agent

      - name: cargo build provedex-cli
        run: cargo build --release --locked --target ${{ matrix.target }} -p provedex-cli

      - name: archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p dist
          # Archive label : actual binary name. The cli crate is named
          # provedex-cli but its binary is `provedex` (the user-facing
          # command name); see crates/provedex-cli/Cargo.toml.
          for entry in provedex-agent:provedex-agent provedex-cli:provedex; do
            label="${entry%%:*}"
            bin="${entry##*:}"
            BIN_OUT="target/${{ matrix.target }}/release/${bin}"
            ARCHIVE="dist/${label}-${VERSION}-${{ matrix.target }}.tar.gz"
            tar -C "$(dirname "$BIN_OUT")" -czf "$ARCHIVE" "$(basename "$BIN_OUT")"
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  container:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/provedex/provedex-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}

      - name: build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/provedex-agent/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [binaries, container]
    steps:
      - uses: actions/checkout@v4

      - name: download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Pin to our matrix uploads. The unbounded form of this action
          # was hitting transient 5-retry failures by enumerating every
          # artifact in the run (including internal GHA-managed ones).
          pattern: binaries-*
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
