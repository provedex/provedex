name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      # rust-toolchain.toml pins the version; rustup show installs it.
      - name: install rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  supply-chain:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: cache cargo registry + tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
          key: ${{ runner.os }}-supply-chain-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: |
            ${{ runner.os }}-supply-chain-

      # cargo-audit checks RustSec advisories against Cargo.lock.
      - name: install cargo-audit
        run: cargo install --locked cargo-audit || echo "already installed"

      - name: cargo audit
        run: cargo audit

      # cargo-deny enforces licenses, banned crates, multiple versions, source policy.
      - name: install cargo-deny
        run: cargo install --locked cargo-deny || echo "already installed"

      - name: cargo deny check
        run: cargo deny check

  bindings-python:
    name: bindings-python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      - name: install rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bindings-
            ${{ runner.os }}-cargo-

      - name: setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bindings/python/provedex-pipecat/pyproject.toml

      - name: build provedex-agent (release)
        run: cargo build --release -p provedex-agent

      - name: install binding with dev deps
        working-directory: bindings/python/provedex-pipecat
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint (ruff)
        working-directory: bindings/python/provedex-pipecat
        run: ruff check src tests

      - name: typecheck (mypy)
        working-directory: bindings/python/provedex-pipecat
        run: mypy src

      - name: unit tests
        working-directory: bindings/python/provedex-pipecat
        run: pytest -v -m "not integration"

      - name: integration tests
        working-directory: bindings/python/provedex-pipecat
        run: pytest -v -m integration

      - name: install langchain binding (dev deps)
        working-directory: bindings/python/provedex-langchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint (ruff) langchain
        working-directory: bindings/python/provedex-langchain
        run: ruff check src tests

      - name: typecheck (mypy) langchain
        working-directory: bindings/python/provedex-langchain
        run: mypy src

      - name: unit tests (langchain)
        working-directory: bindings/python/provedex-langchain
        run: pytest -v -m "not integration"

      - name: integration tests (langchain)
        working-directory: bindings/python/provedex-langchain
        run: pytest -v -m integration

  bindings-python-native:
    name: bindings-python-native (maturin + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      - name: install rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            bindings/python/provedex/target
          key: ${{ runner.os }}-cargo-pynative-${{ hashFiles('Cargo.lock', 'bindings/python/provedex/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pynative-
            ${{ runner.os }}-cargo-

      - name: setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: generate compat vectors
        run: cargo run -p provedex-core --example emit_compat_vectors

      - name: build provedex CLI (for cross-verify)
        run: cargo build --release -p provedex-cli

      - name: install binding (editable, dev deps) + build extension
        working-directory: bindings/python/provedex
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e ".[dev]"
          maturin develop

      - name: lint (ruff)
        working-directory: bindings/python/provedex
        run: ruff check python tests

      - name: typecheck (mypy)
        working-directory: bindings/python/provedex
        run: mypy python tests/test_typing.py

      - name: unit tests
        working-directory: bindings/python/provedex
        run: pytest -v -m "not integration"

      - name: integration tests (cross-verify with the CLI)
        working-directory: bindings/python/provedex
        run: pytest -v -m integration
